
name: Docker CI/CD to EC2

on:
  workflow_run:
    workflows: ["Application CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image locally
        run: |
          docker build \
            -t palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }} \
            -t palaks11/enterprise-deployment-platform-repo:latest \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DEBUG: true
        with:
          image-ref: palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }}
          docker push palaks11/enterprise-deployment-platform-repo:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Send deployment command through SSM
        id: send-command
        env:
          IMAGE: palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }}
          INSTANCE_ID: i-095ce9e285493d318
        run: |
          python - <<'PY'
          import json
          import os

          image = os.environ["IMAGE"]
          instance_id = os.environ["INSTANCE_ID"]

          commands = [
              "set -e",
              f"IMAGE='{image}'",
              "STATE_FILE='/var/lib/enterprise-app/last-good-image'",
              "mkdir -p /var/lib/enterprise-app",
              "echo 'Identifying previous working image...'",
              "PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' enterprise-app 2>/dev/null || cat \"$STATE_FILE\" 2>/dev/null || true)",
              "if [ -n \"$PREVIOUS_IMAGE\" ]; then printf '%s\\n' \"$PREVIOUS_IMAGE\" > \"$STATE_FILE\"; fi",
              "echo 'Pulling new Docker image...'",
              "docker pull \"$IMAGE\"",
              "echo 'Stopping old Gunicorn service...'",
              "systemctl stop gunicorn",
              "echo 'Removing previous container...'",
              "docker rm -f enterprise-app 2>/dev/null || true",
              "echo 'Starting new Docker container...'",
              "if ! docker run -d --name enterprise-app --restart unless-stopped -p 127.0.0.1:8000:8000 \"$IMAGE\"; then echo 'New container failed to start'; fi",
              "echo 'Checking application health...'",
              "for i in $(seq 1 10); do",
              "  if curl --fail --silent http://127.0.0.1/ > /dev/null; then",
              "    echo 'New Docker deployment successful!'",
              "    printf '%s\\n' \"$IMAGE\" > \"$STATE_FILE\"",
              "    systemctl disable gunicorn",
              "    exit 0",
              "  fi",
              "  echo 'Waiting for application...'",
              "  sleep 5",
              "done",
              "echo 'New deployment failed. Starting rollback...'",
              "docker rm -f enterprise-app 2>/dev/null || true",
              "if [ -n \"$PREVIOUS_IMAGE\" ]; then",
              "  echo \"Restoring previous image: $PREVIOUS_IMAGE\"",
              "  if docker run -d --name enterprise-app --restart unless-stopped -p 127.0.0.1:8000:8000 \"$PREVIOUS_IMAGE\"; then",
              "    for i in $(seq 1 10); do",
              "      if curl --fail --silent http://127.0.0.1/ > /dev/null; then",
              "        echo 'Rollback successful. Previous version is running.'",
              "        exit 1",
              "      fi",
              "      sleep 5",
              "    done",
              "    echo 'Previous Docker image also failed its health check.'",
              "  fi",
              "fi",
              "echo 'Docker rollback unavailable or unsuccessful. Starting Gunicorn fallback...'",
              "docker rm -f enterprise-app 2>/dev/null || true",
              "systemctl start gunicorn",
              "exit 1"
          ]

          request = {
              "InstanceIds": [instance_id],
              "DocumentName": "AWS-RunShellScript",
              "Comment": "Deploy enterprise application from GitHub Actions",
              "Parameters": {
                  "commands": commands
              }
          }

          with open("ssm-request.json", "w") as file:
              json.dump(request, file)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-request.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          INSTANCE_ID: i-095ce9e285493d318
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "Deployment failed. SSM output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
