
name: Docker CI/CD to EC2

on:
  workflow_run:
    workflows: ["Application CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image locally
        run: |
          docker build \
            -t palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }} \
            -t palaks11/enterprise-deployment-platform-repo:latest \
            .

      - name: Inspect pip embedded SBOM
        run: |
          IMAGE="palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }}"
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'grep -in -C 2 "setuptools" /usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json || true'

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DEBUG: true
        with:
          image-ref: palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image with commit SHA
        run: |
          docker push palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }}

      - name: Push latest Docker image
        run: |
          docker push palaks11/enterprise-deployment-platform-repo:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy application using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "IMAGE=palaks11/enterprise-deployment-platform-repo:${{ github.event.workflow_run.head_sha }}",
              "sudo docker pull $IMAGE",
              "PREVIOUS_IMAGE=$(sudo docker inspect enterprise-app --format='\''{{.Config.Image}}'\'' 2>/dev/null || cat /var/lib/enterprise-app/last-good-image 2>/dev/null || true)",
              "sudo systemctl stop gunicorn || true",
              "sudo docker rm -f enterprise-app || true",
              "sudo docker run -d --name enterprise-app --restart unless-stopped -p 127.0.0.1:8000:8000 $IMAGE",
              "sleep 5",
              "if curl --fail --silent http://127.0.0.1/; then",
              "  echo $IMAGE | sudo tee /var/lib/enterprise-app/last-good-image",
              "  echo Deployment successful",
              "  exit 0",
              "fi",
              "echo New deployment failed. Starting rollback...",
              "sudo docker rm -f enterprise-app || true",
              "if [ -n \"$PREVIOUS_IMAGE\" ]; then",
              "  echo Restoring previous image: $PREVIOUS_IMAGE",
              "  sudo docker run -d --name enterprise-app --restart unless-stopped -p 127.0.0.1:8000:8000 $PREVIOUS_IMAGE",
              "  sleep 5",
              "  if curl --fail --silent http://127.0.0.1/; then",
              "    echo Rollback successful. Previous version is running.",
              "    exit 1",
              "  fi",
              "fi",
              "echo Rollback unavailable or failed. Starting Gunicorn fallback...",
              "sudo systemctl start gunicorn || true",
              "exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
